<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>見下ろし麻雀デモ（安全版・各席の山＆捨て牌）</title>
  <style>
    :root{
      --table:#0b5d37; --bg:#0b2f1e;
      --tile-front:#ffffff; --tile-side:#f4d48b; --tile-edge:#e0c27a; --tile-border:#cbd5e1;
      --muted:#cfead0; --man:#d33434; --pin:#0ea5a9; --sou:#16a34a;
    }
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(180deg,var(--bg),#062216);color:var(--muted)}
    .wrap{max-width:1200px;margin:18px auto;padding:12px}
    h1{margin:0 0 10px;color:#f8fafc;font-size:18px}

    .table{background:var(--table);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);position:relative;height:700px;overflow:hidden}
    .hud{position:absolute;right:14px;top:14px;display:flex;gap:8px;align-items:center;z-index:10}
    .btn{background:#115e43;color:#eafaf0;padding:8px 10px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
    .info{font-size:13px;color:#cfead0}
    .log{position:absolute;left:14px;bottom:14px;color:#cbe7c8;font-size:13px;min-width:300px;z-index:10}

    .seat{position:absolute;display:flex;align-items:center;gap:10px}
    .seat .name{font-weight:700;color:#e6f8ea;font-size:13px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
    .seat.top{top:12px;left:50%;transform:translateX(-50%);flex-direction:column}
    .seat.bottom{bottom:12px;left:50%;transform:translateX(-50%);flex-direction:column}
    .seat.left{left:12px;top:50%;transform:translateY(-50%);flex-direction:row}
    .seat.right{right:12px;top:50%;transform:translateY(-50%);flex-direction:row-reverse}

    .hand{display:flex;gap:6px;align-items:flex-end}
    .seat.left .hand{flex-direction:column-reverse;align-items:center}
    .seat.right .hand{flex-direction:column;align-items:center}

    .discard{display:grid;gap:4px}
    .seat.top .discard,.seat.bottom .discard{grid-template-columns:repeat(6,36px);justify-content:center}
    .seat.left .discard,.seat.right .discard{grid-template-columns:repeat(3,36px)}

    .wall-side{display:grid;gap:2px;opacity:.95}
    .wall-side.horiz{grid-auto-flow:column;grid-template-rows:repeat(2,22px)}
    .wall-side.vert{grid-auto-flow:row;grid-template-columns:repeat(2,22px)}
    .brick{width:32px;height:22px;border-radius:3px;background:linear-gradient(180deg,#2b3940,#0f1724);box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06)}

    .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:1}
    .machine{width:220px;height:170px;background:radial-gradient(circle at 50% 30%, #133a2a 0%, #0a2c1f 60%, #072219 100%);border:2px solid rgba(255,255,255,.08);border-radius:12px;box-shadow:inset 0 6px 18px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center}
    .machine .wind{color:#e6f8ea;font-weight:800;letter-spacing:.2em}
    .machine .dice{margin-top:6px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}

    .tile{position:relative;width:52px;height:74px;border-radius:6px;background:linear-gradient(180deg,var(--tile-front),#f3f4f6);border:1px solid var(--tile-border);box-shadow:0 6px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;user-select:none}
    .tile::before{content:"";position:absolute;top:-1px;bottom:-1px;right:-6px;width:6px;background:linear-gradient(180deg,var(--tile-side),#e8c379);border-left:1px solid var(--tile-edge);border-radius:0 6px 6px 0;transform:skewY(-4deg)}
    .tile.small{width:36px;height:52px;border-radius:4px}
    .tile.back{background:linear-gradient(180deg,#2b3940,#0f1724);color:#9ca3af;border:1px solid rgba(255,255,255,0.06)}
    .tile.back::before{background:linear-gradient(180deg,#1d2630,#0b1220);border-left:1px solid rgba(255,255,255,0.05)}

    .face{display:flex;flex-direction:column;align-items:center;line-height:1}
    .idx{font-size:12px;opacity:.85;margin-bottom:2px}
    .pip{font-size:18px;font-weight:800}
    .m .pip,.m .idx{color:#d33434}
    .p .pip,.p .idx{color:#0ea5a9}
    .s .pip,.s .idx{color:#16a34a}
    .aka .pip{color:#ef4444}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>見下ろし麻雀デモ（各席の山・各席前に捨て牌・CSS牌）</h1>
    <div class="table">
      <div class="hud">
        <div class="info">ターン: <span id="turnLabel">-</span></div>
        <button class="btn" id="resetBtn">リセット</button>
      </div>

      <div class="seat top">
        <div class="name">対面（上）</div>
        <div class="hand" id="handTop"></div>
        <div class="wall-side horiz" id="wallTop"></div>
        <div class="discard" id="discardTop"></div>
      </div>

      <div class="seat left">
        <div class="hand" id="handLeft"></div>
        <div class="wall-side vert" id="wallLeft"></div>
        <div class="discard" id="discardLeft"></div>
        <div class="name" style="writing-mode:vertical-rl;">左（かみちゃ）</div>
      </div>

      <div class="seat right">
        <div class="hand" id="handRight"></div>
        <div class="wall-side vert" id="wallRight"></div>
        <div class="discard" id="discardRight"></div>
        <div class="name" style="writing-mode:vertical-rl;">右（しもちゃ）</div>
      </div>

      <div class="seat bottom">
        <div class="hand" id="handBottom"></div>
        <div class="wall-side horiz" id="wallBottom"></div>
        <div class="discard" id="discardBottom"></div>
        <div class="name">あなた</div>
      </div>

      <div class="center">
        <div class="machine">
          <div class="wind">東 1 局</div>
          <div class="dice">⚀ ⚄</div>
        </div>
        <div class="info">CPUはツモ切り／ページ読み込みで自動配牌</div>
      </div>

      <div class="log" id="log">ロード中…自動で配牌します。</div>
    </div>
  </div>

  <script>
  // ------- ユーティリティと安全ガード -------
  const $ = (id) => document.getElementById(id);
  function safe(el, cb){ if(!el) return; cb(el); }
  function makeTiles(){ const suits=['m','p','s']; const tiles=[]; for(const s of suits){ for(let n=1;n<=9;n++){ for(let i=0;i<4;i++) tiles.push(n+s); } } return tiles; }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a; }

  // ------- 状態 -------
  let wall=[];              // 共有の山
  let wallSide=[27,27,27,27]; // 各席の見た目用山
  const hands=[[],[],[],[]];
  const discards=[[],[],[],[]];
  let turn=3; // あなた

  // 要素参照（nullでも落ちないように扱う）
  const elHand=[ $('handTop'), $('handLeft'), $('handRight'), $('handBottom') ];
  const elDiscard=[ $('discardTop'), $('discardLeft'), $('discardRight'), $('discardBottom') ];
  const elWall=[ $('wallTop'), $('wallLeft'), $('wallRight'), $('wallBottom') ];
  const turnLabel=$('turnLabel');
  const logEl=$('log');
  const resetBtn=$('resetBtn');

  function log(msg){ if(logEl) logEl.textContent=msg; }

  function createTileEl(t, small=false){
    const suit=t.slice(-1), val=t.slice(0,-1);
    const tile=document.createElement('div');
    tile.className='tile'+(small?' small':'')+' '+suit+(val==='5'?' aka':'');
    const face=document.createElement('div'); face.className='face';
    const idx=document.createElement('div'); idx.className='idx'; idx.textContent=val;
    const pip=document.createElement('div'); pip.className='pip'; pip.textContent={m:'萬',p:'筒',s:'索'}[suit];
    face.appendChild(idx); face.appendChild(pip); tile.appendChild(face);
    return tile;
  }

  function render(){
    // hands
    for(let p=0;p<4;p++){
      safe(elHand[p], el=>{
        el.innerHTML='';
        if(p===3){
          hands[p].forEach((t,i)=>{
            const d=createTileEl(t,false); d.title='クリックで捨てる';
            d.onclick=()=>{ if(turn!==3) return; discard(3,i); };
            el.appendChild(d);
          });
        } else {
          for(let i=0;i<hands[p].length;i++){ const back=document.createElement('div'); back.className='tile small back'; el.appendChild(back); }
        }
      });
    }
    // discards
    for(let p=0;p<4;p++){
      safe(elDiscard[p], el=>{ el.innerHTML=''; discards[p].forEach(t=> el.appendChild(createTileEl(t,true))); });
    }
    // walls
    for(let p=0;p<4;p++){
      safe(elWall[p], el=>{ el.innerHTML=''; const cnt=Math.max(0,Math.min(34,wallSide[p])); for(let i=0;i<cnt;i++){ const b=document.createElement('div'); b.className='brick'; el.appendChild(b); } });
    }
    if(turnLabel) turnLabel.textContent=['対面','左','右','あなた'][turn];
  }

  function deal(){
    wall=shuffle(makeTiles()); wallSide=[27,27,27,27];
    for(let p=0;p<4;p++){ hands[p]=[]; discards[p]=[]; }
    for(let r=0;r<3;r++){ for(let p=0;p<4;p++){ for(let k=0;k<4;k++){ hands[p].push(wall.shift()); if(wallSide[p]>0) wallSide[p]--; } } }
    for(let p=0;p<4;p++){ hands[p].push(wall.shift()); if(wallSide[p]>0) wallSide[p]--; }
    hands[3].push(wall.shift()); if(wallSide[3]>0) wallSide[3]--;
    turn=3; render(); log('配牌完了。あなたの番です。牌をクリックして捨ててください。');
  }

  function discard(playerIndex,tileIndex){
    if(playerIndex!==3) return; if(tileIndex<0||tileIndex>=hands[3].length) return;
    const t=hands[3].splice(tileIndex,1)[0]; discards[3].push(t); render(); log('あなたが捨てた: '+formatTile(t)); nextTurn();
  }
  function cpuAct(p){ if(wall.length===0) return; const t=wall.shift(); if(wallSide[p]>0) wallSide[p]--; hands[p].push(t); const d=hands[p].pop(); discards[p].push(d); render(); log(['対面','左','右'][p]+' (CPU) ツモ切り: '+formatTile(d)); }
  function nextTurn(){ turn=(turn+1)%4; render(); if(turn!==3){ setTimeout(()=>{ cpuAct(turn); nextTurn(); }, 360); } else { log('あなたの番です。牌をクリックして捨ててください。'); } }
  function formatTile(t){ if(!t) return ''; const v=t.slice(0,-1), s=t.slice(-1); return v+{m:'萬',p:'筒',s:'索'}[s]; }

  if(resetBtn){ resetBtn.addEventListener('click',()=>deal()); }
  // 初期描画＆自動配牌
  render();
  window.addEventListener('load',()=>{ setTimeout(()=>deal(), 150); });
  </script>
</body>
</html>
